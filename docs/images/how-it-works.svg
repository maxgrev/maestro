<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">How Maestro connects your StopWatch and agents</title>
  <desc id="desc">The StopWatch connects over Wi-Fi or Tailscale to Maestro on an Apple Silicon Mac. The Mac handles local speech, history, and connections to Codex, Claude Code, Pi, Grok Bot, and Dot. Muse connects through its native SDK on the watch.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m2 2 4 3-4 3" fill="none" stroke="#6b7d61" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="380" rx="20" fill="#f1f3ec"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#252c25">
    <g transform="translate(58 45)">
      <rect x="51" y="25" width="20" height="24" rx="5" transform="rotate(-42 61 37)" fill="#e8c75f"/>
      <rect x="172" y="25" width="20" height="24" rx="5" transform="rotate(42 182 37)" fill="#79a5ce"/>
      <circle cx="122" cy="113" r="92" fill="#344035"/>
      <circle cx="122" cy="113" r="85" fill="#151a16" stroke="#52604c" stroke-width="1"/>
      <path d="M78 130v-24l18 19 26-45 26 45 18-19v24" fill="none" stroke="#d0e3bc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="122" y="245" text-anchor="middle" font-size="25" font-weight="600">Your StopWatch</text>
      <text x="122" y="276" text-anchor="middle" font-size="19" fill="#60695d">Talk · listen · read</text>
      <text x="122" y="307" text-anchor="middle" font-size="17" fill="#60695d">Muse connects directly</text>
    </g>
    <path d="M294 159H417" fill="none" stroke="#6b7d61" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="356" y="124" text-anchor="middle" font-size="19" fill="#60695d">Wi-Fi</text>
    <text x="356" y="197" text-anchor="middle" font-size="16" fill="#60695d">or Tailscale</text>
    <g transform="translate(438 53)">
      <rect width="296" height="207" rx="13" fill="#fdfefa" stroke="#b8c3af" stroke-width="2"/>
      <path d="M0 43H296" stroke="#dce2d5"/>
      <circle cx="19" cy="22" r="4" fill="#b8c3af"/><circle cx="34" cy="22" r="4" fill="#b8c3af"/><circle cx="49" cy="22" r="4" fill="#b8c3af"/>
      <text x="148" y="29" text-anchor="middle" font-size="18" font-weight="600">Maestro</text>
      <g font-size="20" fill="#344d35">
        <text x="29" y="87">Local speech</text>
        <text x="29" y="130">Conversation history</text>
        <text x="29" y="173">Agent connections</text>
      </g>
      <path d="M-20 207h336l-17 13H-3Z" fill="#b8c3af"/>
      <text x="148" y="271" text-anchor="middle" font-size="25" font-weight="600">Your Mac</text>
      <text x="148" y="302" text-anchor="middle" font-size="19" fill="#60695d">Apple Silicon · stays online</text>
    </g>
    <path d="M758 159H856" fill="none" stroke="#6b7d61" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="807" y="124" text-anchor="middle" font-size="18" fill="#60695d">Messages</text>
    <text x="807" y="197" text-anchor="middle" font-size="18" fill="#60695d">and replies</text>
    <g transform="translate(885 53)">
      <text y="25" font-size="25" font-weight="600">Your agents</text>
      <g font-size="21">
        <text y="76">Codex</text><text y="116">Claude Code</text><text y="156">Pi</text><text y="196">Grok Bot</text><text y="236">Dot</text>
      </g>
      <text y="302" font-size="18" fill="#60695d">Your accounts and approvals</text>
    </g>
  </g>
</svg>
