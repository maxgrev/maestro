<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox | Maestro</title><script src="/appearance.js"></script><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/characters.css"><link rel="stylesheet" href="/inbox.css"></head>
<body>
<header class="app-sidebar">
  <a class="brand" href="/"><svg viewBox="0 0 28 32" fill="none" aria-hidden="true"><path d="M3 23V10l7 9 4-14 4 14 7-9v13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Maestro</a>

  <nav class="app-nav" aria-label="Main navigation"><a href="/" data-nav="conversations">Conversations<span class="nav-shortcut" aria-hidden="true">⌘1</span></a><a href="/inbox.html" data-nav="inbox" aria-current="page">Inbox<span class="nav-shortcut" aria-hidden="true">⌘2</span></a><a href="/setup.html" data-nav="setup">Setup<span class="nav-shortcut" aria-hidden="true">⌘3</span></a></nav>
  <div class="sidebar-footer"><span id="connection" class="bridge-status" role="status">Connecting…</span><div class="appearance-row"><label for="appearance">Appearance</label><select id="appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div></div>
</header>
<main class="app-main inbox-main">
<section id="inbox-list" aria-labelledby="inbox-title"><div class="page-heading"><h1 id="inbox-title">Inbox <span id="unread" class="unread-count"></span></h1><button id="refresh" class="text-button">Refresh</button></div>
<div class="inbox-tools"><div class="inbox-filters" aria-label="Filter replies"><button id="filter-all" aria-pressed="true">All replies</button><button id="filter-unread" aria-pressed="false">Unread</button></div><label class="search-label" for="inbox-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="inbox-search" type="search" placeholder="Search replies" aria-label="Search loaded replies" title="Searches loaded replies. Load older replies to search more."></label></div>
<p id="arrivals" role="status"></p><p id="warnings" class="warnings" role="status"></p>
<div id="replies" aria-busy="true"><div class="inbox-skeleton" aria-label="Loading replies"><div></div><div></div><div></div></div></div><button id="older" class="text-button" hidden>Older replies</button></section>
<section id="reader" hidden aria-labelledby="reply-title"><button id="back" class="text-button">← Inbox</button><h1 id="reply-title" tabindex="-1"></h1><p id="reply-meta"></p><div id="reply-text" class="inbox-answer markdown"></div></section>
<p id="error" class="error" role="alert"></p>
</main><script type="module" src="/shell.js"></script><script type="module" src="/inbox.js"></script></body></html>
