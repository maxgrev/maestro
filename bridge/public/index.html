<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conversations | Maestro</title><script src="/appearance.js"></script>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/characters.css"><link rel="stylesheet" href="/conversations.css">
</head>
<body class="conversations-page">
  <header class="window-toolbar">
    <button id="toggle-sidebar" class="toolbar-button" aria-label="Hide conversations" aria-controls="conversation-sidebar" aria-expanded="true" title="Show or hide conversations (⌘B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M5.5 8h1M5.5 11h1"/></svg></button>
    <span class="toolbar-title">Maestro</span><button id="new-conversation" class="toolbar-button" aria-label="New conversation" title="New conversation (⌘N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-7M15.5 4.5l4 4M11 13l1-4 6.5-6.5 4 4L16 13l-5 1Z"/></svg></button>
  </header>
  <main class="app-main conversation-main">
    <h1 class="visually-hidden">Conversations</h1>
    <div class="conversation-workspace">
      <section id="conversation-sidebar" class="conversation-list-pane" aria-label="Conversation list">
        <label class="search-label" for="search">Search conversations</label><input id="search" type="search" placeholder="Search" autocomplete="off">
        <div class="conversation-filters" aria-label="Filter conversations"><button id="filter-all" aria-pressed="true">All</button><button id="filter-unread" aria-pressed="false">Unread <span id="unread-count"></span></button><button id="refresh" class="refresh-button" aria-label="Refresh conversations" title="Refresh conversations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8a7.5 7.5 0 1 0 .3 7M19 3.5V8h-4.5"/></svg></button></div>
        <div id="conversations" class="conversation-list" role="list" aria-label="Conversations" aria-busy="true"><div class="conversation-skeleton" aria-label="Loading conversations"><div></div><div></div><div></div></div></div>
        <footer class="conversation-sidebar-footer"><p id="list-error" class="error" role="alert"></p><details id="warnings" class="connection-details" hidden><summary>Connection details</summary><div id="warning-text"></div></details><span id="connection" class="bridge-status" role="status">Connecting…</span><div class="sidebar-links"><a class="setup-link" href="/setup.html#device">Device &amp; agent setup</a><a class="settings-shortcut" href="/settings.html" aria-label="Settings" title="Settings (⌘,)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 3-.5 2.2-2 .9-2-.7-2 3.4 1.6 1.5v2.4L3.5 14l2 3.4 2-.7 2 .9L10 20h4l.5-2.4 2-.9 2 .7 2-3.4-1.6-1.3v-2.4l1.6-1.5-2-3.4-2 .7-2-.9L14 3h-4Z"/><circle cx="12" cy="11.5" r="3"/></svg></a></div></footer>
      </section>
      <div id="sidebar-resizer" role="separator" aria-label="Resize conversation sidebar" aria-orientation="vertical" aria-controls="conversation-sidebar" aria-valuemin="240" aria-valuemax="420" aria-valuenow="300" tabindex="0" title="Drag to resize. Double-click to reset."></div>
      <section id="thread" class="conversation-thread" aria-label="Selected conversation" tabindex="-1">
        <div id="no-selection" class="thread-empty"><div class="companion codex" aria-hidden="true"></div><h2 id="no-selection-title">Choose a conversation</h2><button id="no-selection-start" hidden>New conversation</button><a id="no-selection-setup" class="button-link" href="/setup.html#agents" hidden>Agent setup</a><button id="no-selection-retry" hidden>Try again</button></div>
        <header id="thread-header" class="thread-header" hidden><button id="back" class="text-button thread-back" aria-label="Back to conversations"><svg class="direction-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><div class="portrait portrait-large" aria-hidden="true"><div id="thread-character" class="companion"></div></div><div class="thread-heading"><h2 id="thread-title" tabindex="-1"></h2><p id="thread-meta"></p></div></header>
        <div id="history-scroll" class="history-scroll" tabindex="0" aria-label="Conversation history" hidden><div class="history-content"><button id="older" class="text-button" hidden>Earlier messages</button><p id="history-status" class="history-status" role="status"></p><div id="history" role="log" aria-live="polite" aria-relevant="additions"></div></div></div>
        <div id="reply-area" class="reply-area" hidden>
          <div id="reply-connection" class="reply-connection" role="status" hidden><div><h3 id="reply-state"></h3><p id="reply-help"></p></div><button id="connect-session">Connect session</button><a id="setup-agent" class="text-button" href="/setup.html#agents" hidden>Agent setup</a></div>
          <form id="composer"><label class="visually-hidden" id="recipient" for="message">Reply</label><textarea id="message" rows="2" maxlength="8000" placeholder="Reply…" aria-describedby="reply-help" required></textarea><div class="composer-footer"><span id="send-hint"></span><button type="submit" id="send" disabled>Send</button></div></form>
          <p id="error" class="error" role="alert"></p>
        </div>
      </section>
    </div>
  </main>
  <dialog id="new-dialog" aria-labelledby="new-title"><div class="dialog-heading"><h2 id="new-title">New conversation</h2><button id="close-new" type="button" class="toolbar-button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="new-targets"></div><a class="text-button" href="/setup.html#agents">Agent setup</a></dialog>
  <script type="module" src="/shell.js"></script><script type="module" src="/app.js"></script>
</body>
</html>
